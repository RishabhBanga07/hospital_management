name: Build and deploy Node.js app to Azure Web App - hospital-management-system

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: read

steps:
  - uses: actions/checkout@v4

  - name: Set up Node.js version
    uses: actions/setup-node@v4
    with:
      node-version: '22.x'

  - name: npm install
    working-directory: backend
    run: npm install

  - name: Build
    working-directory: backend
    run: npm run build --if-present

  - name: Test
    working-directory: backend
    run: npm run test --if-present

  - name: Upload backend artifact
    uses: actions/upload-artifact@v4
    with:
      name: node-app
      path: backend/

deploy:
runs-on: ubuntu-latest
needs: build
permissions:
id-token: write
contents: read

steps:
  - name: Download artifact from build job
    uses: actions/download-artifact@v4
    with:
      name: node-app

  - name: Login to Azure
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C79F7F421D1F4F649A95CC57EA9D8851 }}
      tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EBDCC783987D4997A255F3E28F0B14A1 }}
      subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_37E5ACE0B9F144F3B29B86C18CE197AB }}

  - name: Deploy to Azure Web App
    id: deploy-to-webapp
    uses: azure/webapps-deploy@v3
    with:
      app-name: 'hospital-management-system'
      slot-name: 'Production'
      package: .
